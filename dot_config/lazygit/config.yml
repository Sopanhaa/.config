# =====================================
# lazygit configuration
# Docs: https://github.com/jesseduffield/lazygit/wiki/Configuring-Lazygit
# =====================================

gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showListFooter: false
  showRandomTip: false
  showCommandLog: false
  border: rounded
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#45475a"
    searchingActiveBorderColor:
      - "#f9e2af"
      - bold
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#313244"
    cherryPickedCommitFgColor:
      - "#1e1e2e"
    cherryPickedCommitBgColor:
      - "#89b4fa"
    markedBaseCommitFgColor:
      - "#1e1e2e"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"

git:
  paging:
    colorArg: always
    # Requires git-delta: https://github.com/dandavison/delta
    # pager: delta --dark --paging=never

keybinding:
  universal:
    quit: q
    return: <esc>
    createRebaseOptionsMenu: "m"
