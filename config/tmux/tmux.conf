# =====================================
# tmux configuration
# Loaded from ~/.config/tmux/tmux.conf (tmux 3.2+)
# =====================================

# --- Prefix --------------------------------------------------------------
set -g prefix C-Space
bind C-Space send-prefix
unbind C-b

# --- Terminal ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000

# --- General -------------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi
set -g detach-on-destroy off
set -g allow-rename off

# --- Keybindings ---------------------------------------------------------
# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Splits inherit the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window / session in the current directory
bind c new-window -c "#{pane_current_path}"

# Quick popups
bind g display-popup -E -w 90% -h 90% "lazygit"
bind f display-popup -E -w 90% -h 90% "fish"

# --- Copy mode -----------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- Appearance ----------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#a6adc8"
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=default] "
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f9e2af]PREFIX ,}#[fg=#a6adc8]%H:%M #[fg=#89b4fa]%d-%b"

setw -g window-status-format " #[fg=#6c7086]#I #[fg=#a6adc8]#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g clock-mode-colour "#89b4fa"
